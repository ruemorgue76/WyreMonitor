<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>WyreMonitor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23123a32'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23d8b45a'/%3E%3C/svg%3E" />
  <link rel="preload" href="/fonts/b612-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <p class="mark">WyreMonitor</p>
    <div class="verdict" id="verdict" aria-live="polite">
      <h1 id="verdictTitle">Reading sensors</h1>
      <div id="verdictBody" class="verdict-body"></div>
    </div>
    <div class="tools">
      <p class="fresh" id="fresh"></p>
      <button type="button" class="tool" id="railToggle" aria-controls="rail">Hide detail</button>
      <button type="button" class="tool" id="settingsToggle" aria-expanded="false" aria-controls="settings">Settings</button>
    </div>
    <section class="settings" id="settings" aria-label="Settings" hidden>
      <fieldset>
        <legend>Temperature</legend>
        <label><input type="radio" name="unit" value="C" /> Celsius (°C)</label>
        <label><input type="radio" name="unit" value="F" /> Fahrenheit (°F)</label>
      </fieldset>
      <fieldset>
        <legend>Update the values</legend>
        <label><input type="radio" name="rate" value="1" /> Every second</label>
        <label><input type="radio" name="rate" value="2" /> Twice a second <small>uses about twice as much CPU</small></label>
      </fieldset>
      <fieldset>
        <legend>Chart</legend>
        <label><input type="radio" name="chart" value="60" /> Last minute</label>
        <label><input type="radio" name="chart" value="300" /> Last 5 minutes</label>
        <label><input type="radio" name="chart" value="900" /> Last 15 minutes</label>
      </fieldset>
      <fieldset>
        <legend>Fan icons</legend>
        <label><input type="radio" name="fans" value="spin" /> Spin faster or slower with the fan</label>
        <label><input type="radio" name="fans" value="still" /> Stay still <small>uses the least CPU</small></label>
      </fieldset>
      <fieldset>
        <legend>Alerts</legend>
        <label><input type="checkbox" name="alert" value="temps" /> High temperatures</label>
        <table class="limits">
          <thead><tr><th scope="col">Limits</th><th scope="col">Warning</th><th scope="col">Critical</th></tr></thead>
          <tbody id="limitRows"></tbody>
        </table>
        <p class="settings-error" id="limitError" role="alert" hidden></p>
        <label><input type="checkbox" name="alert" value="fans" /> A fan that stops</label>
        <label><input type="checkbox" name="alert" value="space" /> Windows drive almost full</label>
        <label><input type="checkbox" name="alert" value="wear" /> SSD near the end of its life</label>
        <button type="button" class="link" id="resetAlerts">Restore the default alerts</button>
      </fieldset>
      <p class="settings-note" id="hiddenNote" hidden><span id="hiddenCount"></span> <button type="button" class="link unhide">Show them again</button></p>
      <p class="settings-note">Settings are kept for your Windows account. Names and hidden parts are set in the detail panel.</p>
    </section>
  </header>

  <main class="bench">
    <section class="board-wrap" aria-label="Plan of the machine">
      <div class="board" id="board"></div>
      <div class="key">
        <span class="key-item"><i class="key-gold"></i>Gold: how busy it is</span>
        <span class="key-item"><i class="key-heat"></i>Colour: how close it is to its limit</span>
        <span class="key-item" id="keyHidden"></span>
        <span class="key-item" id="keyParts" hidden><span id="keyPartsText"></span> <button type="button" class="link unhide">Show them again</button></span>
      </div>
    </section>

    <aside class="rail" id="rail" aria-label="Detail of the selected part">
      <h2 id="railTitle"></h2>
      <p class="rail-sub" id="railSub"></p>
      <div class="rail-actions">
        <button type="button" class="link" id="renameToggle" aria-pressed="false">Rename sensors</button>
        <button type="button" class="link" id="hidePart"></button>
      </div>
      <div class="scope">
        <p class="scope-name" id="scopeName"></p>
        <p class="scope-value" id="scopeValue"></p>
        <canvas id="scope" height="130" role="img" aria-label="Chart of the selected sensor"></canvas>
        <p class="scope-foot"><span id="scopeSpan">Last minute</span><span id="scopeRange"></span></p>
      </div>
      <div class="sensors" id="sensors"></div>
      <button type="button" class="more" id="more" hidden></button>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
