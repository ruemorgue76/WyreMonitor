# Builds the installer on GitHub's own machines, from the code in this repository, and publishes
# the release. Started by a version tag (Publish-Release.ps1 pushes one), or by hand from the
# Actions tab: "Run workflow" on main with "Publish" ticked tags the version in WyreMonitor.csproj
# and publishes it, from any browser; without "Publish" it only builds.
#
# Building here instead of on a personal PC means anyone can check how each installer was made:
# this file, the commit and the build log are public.
#
# Code signing (SignPath Foundation, see README "Code signing policy"). Only files built from this
# repository are signed: WyreMonitor.exe and WyreMonitor.dll before they are packaged, then the
# installer. Each signing request waits for a maintainer to approve it on SignPath.
# Signing is on once the repository variable SIGNPATH_ORGANIZATION_ID and the secret
# SIGNPATH_API_TOKEN exist (Settings > Secrets and variables > Actions); until then the
# installer is published unsigned, as before. Tag builds are signed; a build started by hand
# is signed only when "Sign" is ticked.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in WyreMonitor.csproj (run on main)
        type: boolean
        default: false
      sign:
        description: Sign the files (needs an approval on SignPath)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only to create the release
      actions: read     # SignPath reads this run's details and artifacts
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && (github.event_name == 'push' || inputs.publish || inputs.sign) }}
    steps:
      # Actions are pinned to exact commits: a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # tags and history, for the release notes

      # Before building, so a wrong start fails in seconds.
      - name: Check what will be published
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content WyreMonitor.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match version $version in WyreMonitor.csproj" }
          } else {
            if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish only from main: choose main in "Use workflow from".' }
            if (git tag -l "v$version") { throw "Version $version is already published: raise <Version> in WyreMonitor.csproj first." }
          }
          Write-Host "Publishing WyreMonitor $version"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the app
        id: publish
        shell: pwsh
        run: |
          ./Build-Installer.ps1 -PublishOnly | Out-Null
          $version = ([xml](Get-Content WyreMonitor.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      # --- Sign the app's own files (not the .NET runtime or other projects' libraries) ---
      - name: Upload the app for signing
        id: upload-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unsigned
          path: |
            publish/WyreMonitor.exe
            publish/WyreMonitor.dll
          if-no-files-found: error

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'WyreMonitor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400   # time to approve it on SignPath
          output-artifact-directory: ${{ runner.temp }}/signed-app
          parameters: |
            version: ${{ toJSON(steps.publish.outputs.version) }}

      - name: Put the signed files in the app
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'WyreMonitor.exe', 'WyreMonitor.dll') {
            $file = Join-Path $env:RUNNER_TEMP "signed-app/$name"
            if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') { throw "$name is not signed" }
            Copy-Item $file publish -Force
          }

      # --- Installer ---
      - name: Build the installer
        id: build
        shell: pwsh
        run: |
          $setup = ./Build-Installer.ps1 -PackageOnly | Select-Object -Last 1
          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($setup.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload the installer
        id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SIGN == 'true' && 'installer-unsigned' || 'installer' }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'WyreMonitor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: ${{ runner.temp }}/signed-installer
          parameters: |
            version: ${{ toJSON(steps.publish.outputs.version) }}

      - name: Use the signed installer
        id: final
        shell: pwsh
        env:
          SETUP: ${{ steps.build.outputs.path }}
          SETUP_NAME: ${{ steps.build.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = $env:SETUP
          if ($env:SIGN -eq 'true') {
            $setup = Join-Path $env:RUNNER_TEMP "signed-installer/$env:SETUP_NAME"
            if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw "The installer is not signed" }
          }
          "path=$setup" >> $env:GITHUB_OUTPUT

      - name: Upload the signed installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: ${{ steps.final.outputs.path }}
          if-no-files-found: error

      - name: Publish the release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP: ${{ steps.final.outputs.path }}
          SETUP_NAME: ${{ steps.build.outputs.name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content WyreMonitor.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $env:TAG = "v$version"

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            # Release notes: the message of the tag, written by Publish-Release.ps1.
            git fetch --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
            $notes = (git tag -l --format='%(contents:body)' $env:TAG) -join "`n"
          } else {
            # Started by hand: release-notes/<version>.md if it exists, otherwise the commits since
            # the previous version. Then tag this commit, as Publish-Release.ps1 would have.
            if (Test-Path "release-notes/$version.md") {
              $notes = Get-Content "release-notes/$version.md" -Raw
            } else {
              $previous = git describe --tags --abbrev=0 2>$null
              $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
              $lines = git log $range --no-merges --format='- %s' | Where-Object { $_ -notmatch '^- Version \d' }
              $notes = "## What's new`n`n" + ($lines -join "`n")
            }
            $body = @{ tag = $env:TAG; message = "WyreMonitor $version`n`n$notes`n"; object = $env:GITHUB_SHA; type = 'commit' } | ConvertTo-Json
            $tagSha = ($body | gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/tags" --input - | ConvertFrom-Json).sha
            gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:TAG" -f "sha=$tagSha" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not create tag $env:TAG" }
          }

          $hash = (Get-FileHash $env:SETUP -Algorithm SHA256).Hash.ToLowerInvariant()
          $signed = if ($env:SIGN -eq 'true') { 'The installer and the app are signed by SignPath Foundation.' } else { 'The installer is not code-signed.' }
          $notes += "`n`n## Verify the download`n`nBuilt by GitHub Actions from tag ``$env:TAG``. $signed SHA-256 of ``$env:SETUP_NAME``:`n`n``````text`n$hash`n```````n`nIn PowerShell: ``Get-FileHash .\$env:SETUP_NAME```n`nSee the [Code signing policy]($env:REPO_URL#code-signing-policy)."
          $file = Join-Path $env:RUNNER_TEMP notes.md
          [IO.File]::WriteAllText($file, $notes)
          gh release create $env:TAG $env:SETUP --title "WyreMonitor $version" --notes-file $file --verify-tag
